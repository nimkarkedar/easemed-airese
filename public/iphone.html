<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Airese · iPhone 17 Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" />
<style>
  :root { --page: #E9EBF0; --ink: #1A1A1A; --muted: #6B6F78; --frame: #2B3140; --frame-edge: #4A5266; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0A0D16; --ink: #F2F3F5; --muted: #8C93A6; } }
  :root[data-theme="dark"] { --page: #0A0D16; --ink: #F2F3F5; --muted: #8C93A6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); font-family: Montserrat, system-ui, sans-serif; color: var(--ink); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; transform-origin: center center; }
  .meta { text-align: center; }
  .meta b { font-weight: 700; font-size: 15px; }
  .meta span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* iPhone 17 Pro: 402 × 874 pt screen */
  .phone { position: relative; width: 426px; height: 898px; border-radius: 68px; padding: 12px;
    background: linear-gradient(145deg, var(--frame-edge), var(--frame) 30%, var(--frame) 70%, var(--frame-edge));
    box-shadow: 0 0 0 1.5px #1a1e28, 0 30px 80px rgba(10,14,30,.35), inset 0 0 0 2px rgba(255,255,255,.08); }
  .phone::before, .phone::after { content: ''; position: absolute; width: 4px; border-radius: 2px; background: var(--frame); }
  .phone::before { left: -4px; top: 190px; height: 64px; box-shadow: 0 84px 0 var(--frame); }
  .phone::after { right: -4px; top: 230px; height: 100px; }
  .screen { position: relative; width: 402px; height: 874px; border-radius: 56px; overflow: hidden; background: #fff; isolation: isolate; }
  #app { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  .statusbar { position: absolute; z-index: 10; top: 0; left: 0; right: 0; height: 62px; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 52px;
    font: 600 17px/1 -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: #fff; } /* the app is dark throughout */
  .statusbar .icons { display: flex; gap: 7px; align-items: center; }
  .island { position: absolute; z-index: 11; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; }
  .home { position: absolute; z-index: 10; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: #fff; pointer-events: none; }

  /* On a real phone: no frame, the app fills the screen */
  @media (max-width: 500px) {
    body { display: block; }
    .stage { transform: none !important; display: block; height: 100%; }
    .meta, .statusbar, .island, .home, .phone::before, .phone::after { display: none; }
    .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; background: none; box-shadow: none; }
    .screen { width: 100%; height: 100%; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="meta"><b>Airese</b><span>iPhone 17 Pro · 402 × 874 pt · live from localhost</span></div>
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .6 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7 7 0 0 0 8 3.9a7 7 0 0 0-4.8 1.8l1.1 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.3c.6 0 1.1.2 1.5.5L8 11 6.5 9.3c.4-.3.9-.5 1.5-.5Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".5"/></svg>
      </span></div>
      <div class="island"></div>
      <iframe id="app" title="Airese app"></iframe>
      <div class="home"></div>
    </div>
  </div>
</div>
<script>
  // Fits the phone to the window. On a real phone the frame drops away.
  (function () {
    var small = window.matchMedia('(max-width: 500px)').matches;
    document.getElementById('app').src = small ? '/' : '/?frame=iphone';
    function fit() {
      if (window.matchMedia('(max-width: 500px)').matches) return;
      var s = Math.min(1, (window.innerHeight - 24) / 960, (window.innerWidth - 24) / 440);
      document.getElementById('stage').style.transform = 'scale(' + s + ')';
    }
    fit(); window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
